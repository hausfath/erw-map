# Publish the map to GitHub Pages.
#
# Uploads only src/, so the live URL is hausfath.github.io/erw-map/ with no
# redirect shim. Everything in src/ is self-contained and relatively linked:
# generated engine_constants.js, app.js, styles.css, land.js and textures/.
#
# There is no build step. The textures and engine_constants.js are generated by
# scripts/build_v0.py and committed, so Pages serves exactly what was tested
# locally. Regenerate and commit them when the pipeline changes.
name: Deploy map to Pages

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued run supersede an in-progress one, but never cancel a run that is
# already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
